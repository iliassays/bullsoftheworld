[project]
name = "bulls-ingestion"
version = "0.0.0"
description = "Market-data ingestion: runs providers on a schedule, writes quotes, publishes ticks."
requires-python = ">=3.12"
dependencies = [
    "bulls-core",
    "bulls-market-data",
    "bulls-analytics",
    "redis>=5.0",
    "arq>=0.26",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ingestion"]
