[project]
name = "bulls-ai-worker"
version = "0.0.0"
description = "Async AI jobs (sentiment, summaries, embeddings, fraud) off the arq queue."
requires-python = ">=3.12"
dependencies = [
    "bulls-core",
    "bulls-ai",
    "redis>=5.0",
    "arq>=0.26",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_worker"]
