<!doctype html>
<html lang="%VITE_DEFAULT_LANG%">
  <head>
    <!-- Content-Security-Policy: defense in depth for the memory-only access token — only our own
         bundles + the two hashed GTM/GA snippets may execute; scripts can only talk to our APIs
         and Google Analytics. ⚠ Editing either inline script below breaks its sha256 hash (GA
         silently stops — check the console); future ad networks need their domains added here. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' https://www.googletagmanager.com 'sha256-WXvrJlZtx5sn3mHglbOx4Zthv2U6QbDqrkthOiChtUI=' 'sha256-SSnlW61bkaqUX2h6xxHMbtN5fAYDx+O3lrUQuVAgKQg='; connect-src 'self' https://api.bullsofdhaka.com https://api.bullsofwallst.com https://bullsofdhaka-api.bullstreetai.com https://*.google-analytics.com https://*.analytics.google.com https://*.googletagmanager.com http://127.0.0.1:* http://localhost:* ws://127.0.0.1:* ws://localhost:*; img-src 'self' data: https:; style-src 'self' 'unsafe-inline'; font-src 'self' data:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-src https://www.googletagmanager.com"
    />
    <!-- Google Tag Manager -->
    <script>
      (function (w, d, s, l, i) {
        w[l] = w[l] || [];
        w[l].push({ "gtm.start": new Date().getTime(), event: "gtm.js" });
        var f = d.getElementsByTagName(s)[0],
          j = d.createElement(s),
          dl = l != "dataLayer" ? "&l=" + l : "";
        j.async = true;
        j.src = "https://www.googletagmanager.com/gtm.js?id=" + i + dl;
        f.parentNode.insertBefore(j, f);
      })(window, document, "script", "dataLayer", "GTM-KJWW62ZH");
    </script>
    <!-- End Google Tag Manager -->
    <!-- Google tag (gtag.js) — GA4 -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-WPD860DBCK"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() {
        dataLayer.push(arguments);
      }
      gtag("js", new Date());
      gtag("config", "G-WPD860DBCK");
    </script>
    <!-- End Google tag -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0b1322" />
    <title>%VITE_HTML_TITLE%</title>
    <meta
      name="description"
      content="%VITE_HTML_DESCRIPTION%"
    />

    <!-- Favicons / app icons -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Open Graph / Twitter (link previews) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="%VITE_OG_SITE_NAME%" />
    <meta property="og:title" content="%VITE_OG_TITLE%" />
    <meta
      property="og:description"
      content="%VITE_OG_DESCRIPTION%"
    />
    <meta property="og:url" content="%VITE_SITE_URL%" />
    <meta property="og:image" content="%VITE_SITE_URL%/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="%VITE_TWITTER_TITLE%" />
    <meta
      name="twitter:description"
      content="%VITE_TWITTER_DESCRIPTION%"
    />
    <meta name="twitter:image" content="%VITE_SITE_URL%/og.png" />
  </head>
  <body>
    <!-- Google Tag Manager (noscript) -->
    <noscript
      ><iframe
        src="https://www.googletagmanager.com/ns.html?id=GTM-KJWW62ZH"
        height="0"
        width="0"
        style="display: none; visibility: hidden"
      ></iframe
    ></noscript>
    <!-- End Google Tag Manager (noscript) -->
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
