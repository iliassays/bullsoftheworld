<!doctype html>
<html lang="%VITE_DEFAULT_LANG%">
  <head>
    <!-- The research beta uses no third-party analytics or advertising scripts. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; connect-src 'self' https://api.bullsofdhaka.com https://api.bullsofwallst.com https://bullsofdhaka-api.bullstreetai.com http://127.0.0.1:* http://localhost:* ws://127.0.0.1:* ws://localhost:*; img-src 'self' data: https:; style-src 'self' 'unsafe-inline'; font-src 'self' data:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-src 'none'"
    />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0b1322" />
    <title>%VITE_HTML_TITLE%</title>
    <meta
      name="description"
      content="%VITE_HTML_DESCRIPTION%"
    />

    <!-- Favicons / app icons -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Open Graph / Twitter (link previews) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="%VITE_OG_SITE_NAME%" />
    <meta property="og:title" content="%VITE_OG_TITLE%" />
    <meta
      property="og:description"
      content="%VITE_OG_DESCRIPTION%"
    />
    <meta property="og:url" content="%VITE_SITE_URL%" />
    <meta property="og:image" content="%VITE_SITE_URL%/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="%VITE_TWITTER_TITLE%" />
    <meta
      name="twitter:description"
      content="%VITE_TWITTER_DESCRIPTION%"
    />
    <meta name="twitter:image" content="%VITE_SITE_URL%/og.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
