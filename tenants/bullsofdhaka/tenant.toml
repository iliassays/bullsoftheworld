# Bulls of Dhaka — Dhaka Stock Exchange (DSE), Bangla-first.
name = "bullsofdhaka"
display_name = "Bulls of Dhaka"
market = "DSE"
locale = "bn"
supported_locales = ["bn", "en"]
timezone = "Asia/Dhaka"
# api.bullsofdhaka.com is deliberately NOT listed here: it's the shared backend every tenant's
# frontend calls (see WEB_API_URL in deploy-web.sh), so its Host header can't identify which
# tenant a request is for. Adding it back would make `host` win over X-Tenant-Host in
# TenantRegistry.resolve() for every tenant, silently resolving all shared-API traffic to DSE
# (the 2026-07-13 cross-tenant data leak: bullsofwallst.com served Bangla/DSE content because of
# exactly this).
domains = [
  "bullsofdhaka.com",
  "www.bullsofdhaka.com",
  "bullsofdhaka.bullstreetai.com",
  "bullsofdhaka-api.bullstreetai.com",
  "localhost",
]
site_url = "https://bullsofdhaka.com"
support_email = "hello@bullsofdhaka.com"
email_from = "Bulls of Dhaka <no-reply@bullsofdhaka.com>"
logo_url = "https://bullsofdhaka.com/logo-mark-v2.png"
tagline_en = "Facts, not rumours"
tagline_bn = "তথ্যে চলুন, গুজবে নয়"
research_beta = false
social_url = "https://www.facebook.com/1214682241723822"

[theme]
accent = "#F5B82E"   # Bull Gold
up = "#16C784"       # DSE: green = up (verify; per-tenant configurable)
down = "#EA3943"     # red = down
dark_first = true
