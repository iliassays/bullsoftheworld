AWSTemplateFormatVersion: "2010-09-09"
Description: Scoped release role for Bulls public sites and Atlas static-site stacks.

Parameters:
  RoleName:
    Type: String
    Default: BullsWebDeployer
  DhakaHostedZoneId:
    Type: String
  WallStreetHostedZoneId:
    Type: String

Resources:
  WebDeployerRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Ref RoleName
      Description: Deploys Bulls static sites and the tenant-isolated Atlas infrastructure.
      MaxSessionDuration: 14400
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AccountAdministratorsOnly
            Effect: Allow
            Principal:
              AWS: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:root
            Action: sts:AssumeRole
      Policies:
        - PolicyName: BullsStaticSiteRelease
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: InspectCaller
                Effect: Allow
                Action: sts:GetCallerIdentity
                Resource: "*"
              - Sid: ManageAtlasStacks
                Effect: Allow
                Action:
                  - cloudformation:CreateChangeSet
                  - cloudformation:CreateStack
                  - cloudformation:DeleteChangeSet
                  - cloudformation:DescribeChangeSet
                  - cloudformation:DescribeStackEvents
                  - cloudformation:DescribeStackResources
                  - cloudformation:DescribeStacks
                  - cloudformation:ExecuteChangeSet
                  - cloudformation:GetTemplateSummary
                  - cloudformation:ListStackResources
                  - cloudformation:UpdateStack
                  - cloudformation:ValidateTemplate
                Resource:
                  - !Sub arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/bulls-atlas-*/*
                  - !Sub arn:${AWS::Partition}:cloudformation:${AWS::Region}:aws:transform/Serverless-2016-10-31
              - Sid: ManageBullsSiteBuckets
                Effect: Allow
                Action:
                  - s3:CreateBucket
                  - s3:DeleteBucket
                  - s3:DeleteBucketPolicy
                  - s3:DeleteObject
                  - s3:DeleteObjectVersion
                  - s3:GetBucketEncryption
                  - s3:GetBucketLocation
                  - s3:GetBucketOwnershipControls
                  - s3:GetBucketPolicy
                  - s3:GetBucketPublicAccessBlock
                  - s3:GetBucketTagging
                  - s3:GetBucketVersioning
                  - s3:GetObject
                  - s3:ListBucket
                  - s3:ListBucketVersions
                  - s3:PutBucketEncryption
                  - s3:PutBucketOwnershipControls
                  - s3:PutBucketPolicy
                  - s3:PutBucketPublicAccessBlock
                  - s3:PutBucketTagging
                  - s3:PutBucketVersioning
                  - s3:PutObject
                  - s3:PutObjectTagging
                Resource:
                  - arn:aws:s3:::bullsofdhaka-web
                  - arn:aws:s3:::bullsofdhaka-web/*
                  - arn:aws:s3:::bullsofwallst-web
                  - arn:aws:s3:::bullsofwallst-web/*
                  - !Sub arn:${AWS::Partition}:s3:::bulls-atlas-*-${AWS::AccountId}
                  - !Sub arn:${AWS::Partition}:s3:::bulls-atlas-*-${AWS::AccountId}/*
              - Sid: ManageAccountCloudFrontSites
                Effect: Allow
                Action:
                  - cloudfront:CreateCachePolicy
                  - cloudfront:CreateDistribution
                  - cloudfront:CreateInvalidation
                  - cloudfront:CreateOriginAccessControl
                  - cloudfront:CreateResponseHeadersPolicy
                  - cloudfront:DeleteCachePolicy
                  - cloudfront:DeleteDistribution
                  - cloudfront:DeleteOriginAccessControl
                  - cloudfront:DeleteResponseHeadersPolicy
                  - cloudfront:GetCachePolicy
                  - cloudfront:GetDistribution
                  - cloudfront:GetDistributionConfig
                  - cloudfront:GetInvalidation
                  - cloudfront:GetOriginAccessControl
                  - cloudfront:GetResponseHeadersPolicy
                  - cloudfront:ListTagsForResource
                  - cloudfront:TagResource
                  - cloudfront:UntagResource
                  - cloudfront:UpdateCachePolicy
                  - cloudfront:UpdateDistribution
                  - cloudfront:UpdateOriginAccessControl
                  - cloudfront:UpdateResponseHeadersPolicy
                Resource:
                  - !Sub arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/*
                  - !Sub arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:cache-policy/*
                  - !Sub arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:origin-access-control/*
                  - !Sub arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:response-headers-policy/*
              - Sid: RequestAtlasCertificates
                Effect: Allow
                Action:
                  - acm:AddTagsToCertificate
                  - acm:DeleteCertificate
                  - acm:DescribeCertificate
                  - acm:GetCertificate
                  - acm:ListTagsForCertificate
                  - acm:RequestCertificate
                Resource: !Sub arn:${AWS::Partition}:acm:${AWS::Region}:${AWS::AccountId}:certificate/*
              - Sid: ManageTenantDns
                Effect: Allow
                Action:
                  - route53:ChangeResourceRecordSets
                  - route53:GetHostedZone
                  - route53:ListResourceRecordSets
                Resource:
                  - !Sub arn:${AWS::Partition}:route53:::hostedzone/${DhakaHostedZoneId}
                  - !Sub arn:${AWS::Partition}:route53:::hostedzone/${WallStreetHostedZoneId}
              - Sid: ObserveDnsChanges
                Effect: Allow
                Action: route53:GetChange
                Resource: !Sub arn:${AWS::Partition}:route53:::change/*

Outputs:
  RoleArn:
    Value: !GetAtt WebDeployerRole.Arn
  RoleName:
    Value: !Ref WebDeployerRole
