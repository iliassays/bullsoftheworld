# Local dev infra. App services run via uv on the host during development;
# this brings up the stateful dependencies. pgvector image ships the extension.
services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped  # survive Mac reboots so the scheduled daily pull has a DB
    environment:
      POSTGRES_USER: bulls
      POSTGRES_PASSWORD: bulls
      POSTGRES_DB: bulls
    ports:
      # Host 5433 -> container 5432, so we never collide with a local Postgres on 5432.
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bulls"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
