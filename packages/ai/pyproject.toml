[project]
name = "bulls-ai"
version = "0.0.0"
description = "AI layer: Claude client, prompts, tasks (sentiment/summaries), RAG retrieval, evals."
requires-python = ">=3.12"
dependencies = [
    "bulls-core",
    "anthropic>=0.40",
    "httpx>=0.27",
    "pydantic>=2.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bulls"]
