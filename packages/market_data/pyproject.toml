[project]
name = "bulls-market-data"
version = "0.0.0"
description = "Market-data provider interface + adapters (the crux: app never touches a source directly)."
requires-python = ">=3.12"
dependencies = [
    "bulls-core",
    "pydantic>=2.7",
    "httpx>=0.27",
    "selectolax>=0.3",  # fast HTML parsing for the DSE scraper
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bulls"]
