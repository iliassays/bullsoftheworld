[project]
name = "bulls-analytics"
version = "0.0.0"
description = "Deterministic technical-analysis engine: computed facts (levels, indicators) over daily bars. No AI."
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    # Market metadata only (cap tiers, currency, calendars) — the single source of size
    # thresholds lives on bulls.core.markets.MarketProfile so prose and filters can't drift.
    "bulls-core",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bulls"]
