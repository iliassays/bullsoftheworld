[project]
name = "bulls-moderation"
version = "0.0.0"
description = "Tenant-agnostic feed-moderation engine: normalize + deterministic rules + heuristic risk score. No AI, no DB — pure functions over text + context (see docs/specs/feed-moderation.md)."
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "pyyaml>=6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bulls"]
