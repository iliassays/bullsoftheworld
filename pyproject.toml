# Bulls of the World — uv workspace root.
# This root is NOT a package; it only ties the workspace members together.
[project]
name = "bulls-of-the-world"
version = "0.0.0"
description = "A multi-tenant social platform for stock markets. First tenant: Bulls of Dhaka (DSE)."
requires-python = ">=3.12"
dependencies = [
    "bulls-core",
    "bulls-market-data",
    "bulls-analytics",
    "bulls-moderation",
    "bulls-ai",
    "bulls-api",
    "bulls-ingestion",
    "bulls-ai-worker",
]

[dependency-groups]
dev = [
    "ruff>=0.6",
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "watchfiles>=0.24",  # enables granian --reload (backend hot reload)
]
research = [
    "lightgbm>=4.6,<5",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# Same-basename test files exist across workspace packages (e.g. two test_digest.py);
# importlib mode namespaces them by path instead of colliding in sys.modules.
addopts = "--import-mode=importlib"

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*", "services/*"]

[tool.uv.sources]
bulls-core = { workspace = true }
bulls-market-data = { workspace = true }
bulls-analytics = { workspace = true }
bulls-moderation = { workspace = true }
bulls-ai = { workspace = true }
bulls-api = { workspace = true }
bulls-ingestion = { workspace = true }
bulls-ai-worker = { workspace = true }
